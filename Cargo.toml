[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.1"
authors = ["screwy <screwygit@proton.me>"]
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.96"
description = "Native Linux music player for Navidrome and Subsonic servers."
repository = "https://github.com/kmarius/slopsonic"
readme = "README.md"
publish = false

[workspace.dependencies]
# Rufin crates
app-identity = { path = "crates/app-identity" }
artwork = { path = "crates/artwork" }
audio-processing = { path = "crates/audio-processing" }
desktop-integration = { path = "crates/desktop-integration" }
downloads = { path = "crates/downloads" }
gtk-editors = { path = "crates/gtk-editors" }
gtk-library = { path = "crates/gtk-library" }
gtk-media-menus = { path = "crates/gtk-media-menus" }
gtk-player = { path = "crates/gtk-player" }
gtk-preferences = { path = "crates/gtk-preferences" }
gtk-shell = { path = "crates/gtk-shell" }
gtk-widgets = { path = "crates/gtk-widgets" }
library = { path = "crates/library" }
playback = { path = "crates/playback" }
playback-gstreamer = { path = "crates/playback-gstreamer" }
process-memory = { path = "crates/process-memory" }
rufin-core = { path = "crates/rufin-core" }
scrobbling = { path = "crates/scrobbling" }
secrets = { path = "crates/secrets" }
sources = { path = "crates/sources" }

# External dependencies
age = "0.12.1"
flate2 = "1.1.10"
tar = "0.4.46"
chrono = "0.4.45"
adw = { package = "libadwaita", version = "0.9.1" }
async-channel = "2.5.0"
base64 = "0.23.0"
blake3 = "1.8.2"
blurhash = { version = "0.2.3", default-features = false }
bytes = "1"
http-body-util = "0.1"
directories = "6.0.0"
ebur128 = "0.1.10"
futures-util = "0.3.32"
getrandom = "0.4.0"
gio = "0.22.6"
gstreamer = "0.25.2"
gstreamer-app = "0.25.2"
gstreamer-audio = "0.25.2"
gstreamer-controller = "0.25.2"
gtk = { package = "gtk4", version = "0.11.3" }
glib = "0.22.7"
glib-build-tools = "0.22.8"
httpdate = "1.0.3"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
jxl = "0.7.4"
jxl-image-rs-integration = "0.7.4"
gif = "0.14.2"
fast_image_resize = { version = "6.1.0", features = ["image"] }
lofty = "0.25.1"
md5_digest = { package = "md-5", version = "0.10" }
mpris-server = "0.10.0"
percent-encoding = "2.3.2"
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.13.3", default-features = false, features = ["http2", "rustls", "system-proxy"] }
roxmltree = "0.21.0"
rustfft = "6.2.0"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.150"
toml = "1.1.3"
serde_path_to_error = "0.1.20"
sqlx = { version = "=0.9.0", default-features = false, features = ["derive", "runtime-tokio", "sqlite", "regexp"] }
libsqlite3-sys = "=0.37.0"
regex = "1.13.1"
tempfile = "3.23.0"
thiserror = "2.0.18"
tokio = "1.53.3"
tracing = "0.1.41"
tracing-subscriber = "0.3.23"
url = "2.5.7"
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "deny"
warnings = "deny"

[workspace.lints.clippy]
style = { level = "allow", priority = -1 }
complexity = { level = "allow", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
large_include_file = "deny"
exit = "deny"
fallible_impl_from = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
debug = "line-tables-only"
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package.libsqlite3-sys]
opt-level = 3

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.1"
authors = ["screwy <screwygit@proton.me>", "kmarius"]
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.96"
description = "Native Linux music player for Navidrome and Subsonic servers."
repository = "https://github.com/kmarius/slopsonic"
readme = "README.md"
publish = false

[workspace.dependencies]
# Slopsonic crates
app-identity = { path = "crates/app-identity" }
artwork = { path = "crates/artwork" }
audio-processing = { path = "crates/audio-processing" }
desktop-integration = { path = "crates/desktop-integration" }
downloads = { path = "crates/downloads" }
gtk-library = { path = "crates/gtk-library" }
gtk-media-menus = { path = "crates/gtk-media-menus" }
gtk-player = { path = "crates/gtk-player" }
gtk-shell = { path = "crates/gtk-shell" }
gtk-widgets = { path = "crates/gtk-widgets" }
library = { path = "crates/library" }
playback = { path = "crates/playback" }
playback-gstreamer = { path = "crates/playback-gstreamer" }
process-memory = { path = "crates/process-memory" }
slopsonic-core = { path = "crates/slopsonic-core" }
scrobbling = { path = "crates/scrobbling" }
sources = { path = "crates/sources" }

# External dependencies
adw = { package = "libadwaita", version = "0.9.1" }
async-channel = "2.5.0"
blake3 = "1.8.2"
blurhash = { version = "0.2.3", default-features = false }
bytes = "1"
http-body-util = "0.1"
directories = "6.0.0"
futures-util = "0.3.32"
getrandom = "0.4.0"
gstreamer = "0.25.2"
gstreamer-app = "0.25.2"
gstreamer-audio = "0.25.2"
gstreamer-controller = "0.25.2"
gtk = { package = "gtk4", version = "0.11.3" }
glib = "0.22.7"
glib-build-tools = "0.22.8"
httpdate = "1.0.3"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
jxl = "0.7.4"
jxl-image-rs-integration = "0.7.4"
gif = "0.14.2"
fast_image_resize = { version = "6.1.0", features = ["image"] }
lofty = "0.25.1"
md5_digest = { package = "md-5", version = "0.10" }
mpris-server = "0.10.0"
percent-encoding = "2.3.2"
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.13.3", default-features = false, features = ["http2", "rustls", "system-proxy"] }
roxmltree = "0.21.0"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.150"
toml = "1.1.3"
serde_path_to_error = "0.1.20"
sqlx = { version = "=0.9.0", default-features = false, features = ["derive", "runtime-tokio", "sqlite"] }
libsqlite3-sys = "=0.37.0"
tempfile = "3.23.0"
thiserror = "2.0.18"
tokio = "1.53.3"
tracing = "0.1.41"
tracing-subscriber = "0.3.23"
url = "2.5.7"
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "deny"
warnings = "deny"

[workspace.lints.clippy]
# Judgment lints: signatures here are GTK/GStreamer plumbing, not idiom problems.
type_complexity = "allow"
too_many_arguments = "allow"
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Noise for this codebase: numeric casts, docs, naming and GTK-shaped signatures.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
too_many_lines = "allow"
doc_markdown = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
items_after_statements = "allow"
missing_const_for_fn = "allow"
wildcard_imports = "allow"
unreadable_literal = "allow"
significant_drop_tightening = "allow"
option_if_let_else = "allow"
redundant_pub_crate = "allow"
future_not_send = "allow"
semicolon_if_nothing_returned = "allow"
use_self = "allow"
# Changes float results or flags intended exact comparisons.
suboptimal_flops = "allow"
float_cmp = "allow"
# `assert!(x.is_empty())` reads better than `assert_eq!(x, [] as [T; 0])`.
assert_is_empty = "allow"
# Signatures shaped by GTK callbacks, traits and builders, not idiom problems.
needless_pass_by_value = "allow"
needless_pass_by_ref_mut = "allow"
trivially_copy_pass_by_ref = "allow"
ref_option = "allow"
option_option = "allow"
unnecessary_wraps = "allow"
unused_self = "allow"
unused_async = "allow"
unused_async_trait_impl = "allow"
return_self_not_must_use = "allow"
single_option_map = "allow"
# Style preferences where the current form reads at least as well.
default_trait_access = "allow"
format_push_string = "allow"
format_collect = "allow"
assigning_clones = "allow"
match_same_arms = "allow"
match_wildcard_for_single_variants = "allow"
or_fun_call = "allow"
useless_let_if_seq = "allow"
nonminimal_bool = "allow"
needless_collect = "allow"
struct_field_names = "allow"
too_long_first_doc_paragraph = "allow"
# Reviewed false positives: placeholder strings, lock-then-take, redacted Debug, range checks.
literal_string_with_formatting_args = "allow"
significant_drop_in_scrutinee = "allow"
missing_fields_in_debug = "allow"
suspicious_operation_groupings = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
large_include_file = "deny"
exit = "deny"
fallible_impl_from = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
debug = "line-tables-only"
opt-level = 0

[profile.test]
debug = "line-tables-only"

[profile.test.package.libsqlite3-sys]
opt-level = 3
